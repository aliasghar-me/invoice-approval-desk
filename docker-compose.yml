# Production stack: Caddy (HTTPS) -> web (Next.js) and /api -> api (NestJS + SQLite volume).
# Usage on the server:  echo DOMAIN=invoices.example.com > .env && docker compose up -d --build
services:
  api:
    build: { context: ., target: api }
    restart: unless-stopped
    environment:
      WEB_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
    volumes:
      - invoices-data:/data

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3001
    depends_on: [api]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, api]

volumes:
  invoices-data:
  caddy-data:
  caddy-config:
