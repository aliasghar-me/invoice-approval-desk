# Base stack: web (Next.js) and api (NestJS + SQLite volume). No public ports here;
# add a proxy layer with COMPOSE_FILE (see README "Deploy"):
#   docker-compose.caddy.yml    fresh server, Caddy owns 80/443
#   docker-compose.traefik.yml  server that already runs Traefik
name: invoice-desk

services:
  api:
    build: { context: ., target: api }
    restart: unless-stopped
    environment:
      WEB_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
    volumes:
      - invoices-data:/data

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3001
    depends_on: [api]

volumes:
  invoices-data:
