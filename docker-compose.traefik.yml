# Server that already runs Traefik (Docker provider, `websecure` entrypoint,
# `letsencrypt` cert resolver). The more specific /api rule wins over the web rule.
services:
  api:
    labels:
      - traefik.enable=true
      - traefik.docker.network=invoice-desk_default
      - traefik.http.routers.invoice-desk-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.invoice-desk-api.entrypoints=websecure
      - traefik.http.routers.invoice-desk-api.tls=true
      - traefik.http.routers.invoice-desk-api.tls.certresolver=letsencrypt
      - traefik.http.services.invoice-desk-api.loadbalancer.server.port=3001

  web:
    labels:
      - traefik.enable=true
      - traefik.docker.network=invoice-desk_default
      - traefik.http.routers.invoice-desk-web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.invoice-desk-web.entrypoints=websecure
      - traefik.http.routers.invoice-desk-web.tls=true
      - traefik.http.routers.invoice-desk-web.tls.certresolver=letsencrypt
      - traefik.http.services.invoice-desk-web.loadbalancer.server.port=3000
